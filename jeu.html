let pbState = null; // état local Petit Bac
const PB_DURATION_EP = 10;


// ---- Épreuve Photos ----
// Points par essai (doit correspondre à POINTS_BY_ATTEMPT côté admin)
const POINTS_PHOTO = [10, 8, 6, 4, 2];

// Cache des photos déjà chargées (id → data url)
const photoThumbCache = new Map();
async function loadPhotoThumb(photoId, imgElId) {
  if (!photoId) return;
  let dataUrl = photoThumbCache.get(photoId);
  if (!dataUrl) {
    const {data} = await db.from('photos').select('data').eq('id', photoId).single();
    if (data?.data) {
      dataUrl = data.data;
      photoThumbCache.set(photoId, dataUrl);
    }
  }
  const el = document.getElementById(imgElId);
  if (el && dataUrl) el.src = dataUrl;
}

let _lastSyncPhotos = 0;
async function syncPhotosFromDB(epreuve) {
  if (!isCaptain) return;
  if (gameState?.status !== 'active') return;
  // Throttle : ne pas appeler plus d'une fois par 2 secondes (le Realtime gère la fraîcheur)
  const now = Date.now();
  if (now - _lastSyncPhotos < 2000) return;
  _lastSyncPhotos = now;
  // Métadonnées uniquement — la data (base64) n'est PAS stockée dans reponse_epreuve
  const {data: photos} = await db.from('photos')
    .select('id,challenge_num,attempt_num,statut,points')
    .eq('equipe_nom', currentTeam)
    .eq('epreuve_id', epreuve.id)
    .order('challenge_num', {ascending:true})
    .order('attempt_num', {ascending:true});

  // Reconstruire le state COMPLET depuis la table photos (source de vérité)
  const state = {
    ch1: {attempts:[], done:false, points:0},
    ch2: {attempts:[], done:false, points:0},
  };

  (photos || []).forEach(p => {
    const st = p.challenge_num === 1 ? state.ch1 : state.ch2;
    const idx = (p.attempt_num || 1) - 1;
    st.attempts[idx] = {
      id: p.id,
      statut: p.statut || 'en_attente',
      points: p.points || 0,
    };
  });

  // Calculer done/points pour chaque challenge
  [state.ch1, state.ch2].forEach(st => {
    const validated = st.attempts.find(a => a && a.statut === 'validee');
    if (validated) {
      st.done = true;
      st.points = validated.points || 0;
    } else if (st.attempts.length >= 5 && st.attempts.every(a => a && a.statut === 'refusee')) {
      // 5 essais tous refusés → terminé, 0 pt
      st.done = true;
      st.points = 0;
    }
  });

  // Normaliser l'ancien state pour comparaison fiable (purger data résiduels)
  const oldRaw = (()=>{try{return JSON.parse(teamState.reponse_epreuve||'{}');}catch(e){return {};}})();
  const oldState = {
    ch1: {attempts: [], done: !!oldRaw.ch1?.done, points: oldRaw.ch1?.points||0},
    ch2: {attempts: [], done: !!oldRaw.ch2?.done, points: oldRaw.ch2?.points||0},
  };
  ['ch1','ch2'].forEach(k => {
    (oldRaw[k]?.attempts || []).forEach((a, i) => {
      if (a) oldState[k].attempts[i] = {
        id: a.id,
        statut: a.statut || 'en_attente',
        points: a.points || 0,
      };
    });
  });
  const oldStr = JSON.stringify(oldState);
  const newStr = JSON.stringify(state);

  // Pas de pop-up : l'affichage des vignettes et de leur statut suffit. On se contente
  // de réaligner l'état local + base et de re-render quand quelque chose a changé.
  if (oldStr !== newStr) {
    if (oldState.ch1?.done && !state.ch1.done) state.ch1.done = true;
    if (oldState.ch2?.done && !state.ch2.done) state.ch2.done = true;

    teamState.reponse_epreuve = JSON.stringify(state);
    // PERSISTER reponse_epreuve : la table photos est la source de vérité, on réaligne
    // jp_team_states pour qu'un écho Realtime ne revienne pas à l'état « en attente »
    // (ce qui rebloquait la soumission d'un nouvel essai).
    await db.from('jp_team_states').update({reponse_epreuve: JSON.stringify(state)}).eq('equipe_nom', currentTeam);
    // Sauvegarder le score
    const total = (state.ch1.points||0) + (state.ch2.points||0);
    const currentScore = (getScores()['ep_'+ (teamState.step_idx||0)] || 0);
    if (total !== currentScore) {
      await saveScore('ep_'+ (teamState.step_idx||0), total);
    }
    // Re-render pour afficher le refus/validation et le bouton de nouvel essai.
    renderTeamView();
  }
}

// Quand l'appli redevient visible (retour après la prise de photo sur mobile, qui met
// l'onglet en arrière-plan et gèle les timers), forcer une resynchro immédiate. C'était
// la cause du « il faut rafraîchir » sur la 1re photo.
let _visibilityHooked = false;
function hookPhotoVisibility() {
  if (_visibilityHooked) return;
  _visibilityHooked = true;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    _lastSyncPhotos = 0;
    renderTeamView();
  });
}

let _photoPollTimer = null, _photoPollBloc = -1;
function startPhotoPolling(epreuve) {
  hookPhotoVisibility();
  if (!isCaptain) return;
  const cur = (()=>{ const p=getParcours(); const H=gameState?.started_at?new Date(gameState.started_at).getTime():Date.now(); return p.length?computePhaseFromSchedule(H,p).blocIdx:-1; })();
  if (_photoPollTimer && _photoPollBloc === cur) return;
  if (_photoPollTimer) { clearInterval(_photoPollTimer); _photoPollTimer = null; }
  _photoPollBloc = cur;
  _photoPollTimer = setInterval(() => {
    // S'arrêter si on n'est plus sur l'épreuve photo de ce bloc
    const parcours = getParcours();
    const H = gameState?.started_at ? new Date(gameState.started_at).getTime() : Date.now();
    const sched = parcours.length ? computePhaseFromSchedule(H, parcours) : {phase:null};
    if (sched.phase !== 'epreuve' || sched.blocIdx !== _photoPollBloc) {
      clearInterval(_photoPollTimer); _photoPollTimer = null; _photoPollBloc = -1; return;
    }
    _lastSyncPhotos = 0; // forcer la resynchro (bypass throttle)
    syncPhotosFromDB(epreuve);
  }, 4000);
}

function renderEpreuvePhoto(epreuve) {
  const state = (()=>{try{return JSON.parse(teamState.reponse_epreuve||'{}');}catch(e){return {};}})();
  // state: { ch1: {attempts:[], done:false, points:0}, ch2: ... }
  if (!state.ch1) state.ch1 = {attempts:[], done:false, points:0};
  if (!state.ch2) state.ch2 = {attempts:[], done:false, points:0};
  const MAX_AT = 5;

  // Synchroniser avec la table photos (statuts mis à jour par l'admin)
  syncPhotosFromDB(epreuve);
  // Poll de secours : le Realtime sur la table photos ne délivre pas toujours les
  // UPDATE (validation/refus admin). On resynchronise donc régulièrement tant qu'on
  // est sur l'épreuve photo, pour notifier le joueur quasi en temps réel.
  startPhotoPolling(epreuve);

  // Timing : 5 minutes par challenge
  // Challenge 1 = première moitié du temps, Challenge 2 = seconde moitié
  // Sauf si challenge 1 validé → challenge 2 disponible immédiatement après
  const parcoursP = getParcours();
  const Hp = gameState?.started_at ? new Date(gameState.started_at).getTime() : Date.now();
  const multP = gameState?.time_multiplier || 1;
  const schedP = computePhaseFromSchedule(Hp, parcoursP);
  const virtualNowP = Hp + (Date.now()-Hp)*multP;
  const epDur = schedP.phaseEnd - schedP.phaseStart;
  const halfDur = epDur / 2;
  const elapsedInEp = virtualNowP - schedP.phaseStart;

  // Quand challenge 1 doit-il se terminer ?
  // - Soit photo validée → done immédiat
  // - Soit 5 essais refusés → done à 0 pts
  // - Soit fin de la première moitié du temps → done à 0 pts si pas de photo validée
  const ch1TimeUp = elapsedInEp >= halfDur;
  if (ch1TimeUp && !state.ch1.done && isCaptain) {
    // Forcer ch1.done si temps écoulé
    state.ch1.done = true;
    if (!state.ch1.attempts.find(a=>a.statut==='validee')) state.ch1.points = 0;
    db.from('jp_team_states').update({reponse_epreuve: JSON.stringify(state)}).eq('equipe_nom', currentTeam);
    teamState.reponse_epreuve = JSON.stringify(state);
  }
  // Ch2 disponible : ch1.done OU ch1 a une photo validée
  const ch1Validated = state.ch1.attempts.find(a=>a.statut==='validee');
  const ch2Available = state.ch1.done || ch1Validated;

  // Planifier l'auto-fin ch1 si pas encore done
  if (!state.ch1.done && !ch1TimeUp && isCaptain) {
    const timeUntilHalf = (schedP.phaseStart + halfDur - virtualNowP);
    const realDelayMs = Math.max(0, timeUntilHalf / multP);
    scheduleTimer('photo_ch1_end_'+schedP.blocIdx, Date.now()+realDelayMs, () => renderTeamView());
  }
  // Planifier l'auto-fin ch2 à la fin du temps total
  if (!state.ch2.done && isCaptain) {
    const timeUntilEnd = (schedP.phaseEnd - virtualNowP);
    const realDelayMs = Math.max(0, timeUntilEnd / multP);
    scheduleTimer('photo_ch2_end_'+schedP.blocIdx, Date.now()+realDelayMs, () => renderTeamView());
  }

  function challengeBlock(num, st, person, locked) {
    const used = st.attempts.length;
    const validated = st.attempts.find(a=>a.statut==='validee');
    const pending = st.attempts.find(a=>a.statut==='en_attente');
    const last = st.attempts[st.attempts.length-1];
    const canSubmit = isCaptain && !st.done && !pending && used < MAX_AT && !locked;

    let dots = '';
    for(let i=0;i<MAX_AT;i++){
      const a=st.attempts[i];
      let cls = a ? (a.statut==='validee'?'attempt-dot success':a.statut==='en_attente'?'attempt-dot current':'attempt-dot used') : (i===used&&!st.done?'attempt-dot current':'attempt-dot inactive');
      dots += `<div class="${cls}">${i+1}</div>`;
    }

    let statusHtml = '';
    if(pending) statusHtml=`<div style="padding:8px 14px;font-size:13px;color:var(--amber)">⏳ Photo en attente de validation...</div>`;
    else if(validated) statusHtml=`<div style="padding:8px 14px;font-size:13px;color:var(--success)">✓ Réussi à l'essai ${st.attempts.indexOf(validated)+1} — +${validated.points||0} pts</div>`;
    else if(st.done) statusHtml=`<div style="padding:8px 14px;font-size:13px;color:var(--danger)">✗ ${used>=MAX_AT?'5 essais épuisés':'Temps écoulé'} — 0 point</div>`;
    else if(last?.statut==='refusee') statusHtml=`<div style="padding:8px 14px;font-size:13px;color:var(--danger)">Photo refusée — essai ${used+1} disponible (max ${POINTS_PHOTO[used]||0} pts)</div>`;

    // Afficher TOUTES les photos déjà envoyées (y compris en attente) pour que le
    // joueur garde une trace de ce qu'il a soumis et n'envoie pas deux fois la même.
    let photoHtml = '';
    const envoyees = st.attempts.filter(a => a && a.id);
    if (envoyees.length) {
      const vignettes = envoyees.map(a => {
        const imgId = 'photo_thumb_'+a.id;
        const lbl = a.statut==='validee' ? '✓ Validée'
                  : a.statut==='refusee' ? '✗ Refusée'
                  : '⏳ En attente';
        const ptsLbl = a.statut==='validee' ? ` +${a.points||0} pts` : '';
        // Fond coloré selon le statut : vert=validée, rouge=refusée, gris=en attente
        const bg  = a.statut==='validee' ? 'var(--success-bg)' : a.statut==='refusee' ? 'var(--danger-bg)' : 'var(--cream)';
        const bdr = a.statut==='validee' ? 'var(--success)'    : a.statut==='refusee' ? 'var(--danger)'    : 'var(--border-strong)';
        const col = a.statut==='validee' ? 'var(--success)'    : a.statut==='refusee' ? 'var(--danger)'    : 'var(--ink-muted)';
        setTimeout(() => loadPhotoThumb(a.id, imgId), 0);
        return `<div style="flex:0 0 96px;background:${bg};border:2px solid ${bdr};border-radius:var(--radius-sm);padding:5px">
          <img id="${imgId}" src="" style="width:100%;height:84px;object-fit:cover;border-radius:4px;background:rgba(0,0,0,.04)">
          <div style="font-size:11px;font-weight:600;color:${col};margin-top:4px;text-align:center;line-height:1.3">Essai ${st.attempts.indexOf(a)+1}<br>${lbl}${ptsLbl}</div>
        </div>`;
      }).join('');
      photoHtml = `<div style="display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px">${vignettes}</div>`;
    }

    const pts = st.done ? (st.points>0?`+${st.points} pts`:'0 pt') : `max ${POINTS_PHOTO[used]||0} pts`;

    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:14px;font-weight:500">Challenge ${num} — ${person}</div>
        <span style="font-size:13px;font-weight:600;color:var(--gold-dark)">${pts}</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px">${dots}</div>
      ${statusHtml}${photoHtml}
      ${canSubmit ? `<div style="padding:0 14px 12px">
        <label style="display:block;cursor:pointer">
          <div class="photo-zone">📷 Soumettre l'essai ${used+1} (${POINTS_PHOTO[used]||0} pts si validée)</div>
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="soumettrePhoto(${num}, this)">
        </label>
      </div>` : ''}
    </div>`;
  }

  const total = (state.ch1.points||0) + (state.ch2.points||0);
  // Ch2 affiché uniquement quand ch1 terminé. (Les règles ne sont PAS affichées ici :
  // elles sont accessibles via « Voir les règles » ajouté par renderEpreuveSchedule.)
  return `
    ${challengeBlock(1, state.ch1, 'Caroline', false)}
    ${ch2Available ? challengeBlock(2, state.ch2, 'Marc', false) : `<div class="card" style="margin-bottom:10px;opacity:.6"><div style="font-size:14px;font-weight:500;margin-bottom:6px">Challenge 2 — Marc</div><div style="font-size:13px;color:var(--ink-muted)">🔒 Disponible après le challenge Caroline</div></div>`}
    <div class="card" style="text-align:center">
      <div style="font-size:12px;color:var(--ink-muted);margin-bottom:4px">Score total</div>
      <div style="font-size:36px;font-weight:400;font-family:'Playfair Display',serif;color:var(--gold-dark)">${total} <span style="font-size:16px;color:var(--ink-muted)">/ 20 pts</span></div>
    </div>`;
}

async function soumettrePhoto(chNum, input) {
  if (!isCaptain || !input.files[0]) return;
  if (gameState?.status !== 'active') return;
  const reader = new FileReader();
  reader.onload = async e => {
    const state = (()=>{try{return JSON.parse(teamState.reponse_epreuve||'{}');}catch(e){return {};}})();
    if (!state.ch1) state.ch1 = {attempts:[], done:false, points:0};
    if (!state.ch2) state.ch2 = {attempts:[], done:false, points:0};
    const st = chNum===1 ? state.ch1 : state.ch2;
    if (st.done || st.attempts.length >= 5) return;

    // 1. INSERT dans photos (avec data base64) — table dédiée, donc pas de bloat sur jp_team_states
    const {data: inserted, error} = await db.from('photos').insert({
      equipe_nom: currentTeam,
      epreuve_id: appData.epreuves.find(ep=>ep.type==='photos')?.id||1,
      data: e.target.result,
      statut: 'en_attente',
      points: 0,
      challenge_num: chNum,
      attempt_num: st.attempts.length + 1
    }).select('id').single();

    if (error) {
      alert('Erreur lors de l\'envoi de la photo : ' + error.message);
      return;
    }

    // 2. UPDATE jp_team_states avec uniquement les métadonnées (PAS la data base64)
    st.attempts.push({id: inserted?.id, statut:'en_attente', points:0});

// ---- Épreuve Petit Bac ----
function renderEpreuvePetitBac(epreuve) {
  const reponses = (()=>{try{return JSON.parse(teamState?.reponse_epreuve||'{}');}catch(e){return {};}})();
  // Toutes les lettres qui ont des villes configurées
  const lettres = Object.keys(appData.villesBac||{}).filter(l=>(appData.villesBac[l]||[]).length>0).sort();
  if (!lettres.length) return `<div class="notice">Aucune ville configurée pour cette épreuve.</div>`;

  let score = 0;
  const rows = lettres.map(l => {
    const valeur = (reponses[l]||'').trim();
    const villes = (appData.villesBac[l]||[]).map(v=>v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
    const normalise = valeur.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const correct = valeur.length > 0 && villes.includes(normalise);
    const wrong   = valeur.length > 0 && !correct;
    if (correct) score++;

    const bgColor  = correct ? 'var(--success-bg)' : wrong ? '#FFF0F0' : 'var(--warm-white)';
    const bdrColor = correct ? 'var(--success)' : wrong ? 'var(--danger)' : 'var(--border)';
    const icon     = correct ? '✅' : wrong ? '❌' : '';

    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">

      <input type="text" value="${valeur.replace(/"/g,'&quot;')}"
        placeholder="Ville en ${l}…"

        onchange="pbSaisir('${l}', this.value)"
        style="flex:1;padding:7px 10px;border-radius:var(--radius-sm);border:1.5px solid ${bdrColor};background:${bgColor};color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;${!isCaptain?'cursor:default;':''}">

async function pbSaisir(lettre, valeur) {
  if (!isCaptain) return;
  const reponses = (()=>{try{return JSON.parse(teamState?.reponse_epreuve||'{}');}catch(e){return {};}})();
  reponses[lettre] = valeur.trim();
  // Marquer si correct
  const villes = (appData.villesBac[lettre]||[]).map(v=>v.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  reponses[lettre+'_correct'] = villes.includes(norm(valeur.trim()));
  // Calculer et sauvegarder ep_N immédiatement
  const parcoursPb = getParcours();
  const Hpb = gameState?.started_at ? new Date(gameState.started_at).getTime() : Date.now();
  const schedPb = computePhaseFromSchedule(Hpb, parcoursPb);
  const blocPb = parcoursPb[schedPb.blocIdx];
  const etapePb = appData.etapes?.find(e=>String(e.id)===String(blocPb?.etapeId));
  const epreuvePb = etapePb?.epreuveId ? appData.epreuves?.find(ep=>String(ep.id)===String(etapePb.epreuveId)) : null;
  if (epreuvePb) saveScore('ep_'+schedPb.blocIdx, calcScoreEpreuve(epreuvePb, reponses));
  await db.from('jp_team_states').update({reponse_epreuve: JSON.stringify(reponses)}).eq('equipe_nom', currentTeam);
  Object.assign(teamState, {reponse_epreuve: JSON.stringify(reponses)});
  renderTeamView();
}

async function terminerEpreuve(scoreEpreuve, forceStepIdx) {
  if (gameState?.status !== 'active') return; // ne rien figer hors partie active
  pbState = null;
  const parcours = getParcours();
  const H = gameState?.started_at ? new Date(gameState.started_at).getTime() : Date.now();
  const sched = computePhaseFromSchedule(H, parcours);
  // Utiliser forceStepIdx si fourni (appelé depuis le poll avec prevBlocIdx)
  const stepIdx = forceStepIdx !== undefined ? forceStepIdx : sched.blocIdx;
  const isLast  = stepIdx >= parcours.length - 1;

  // Sauvegarder dans le dict nommé (jsonb)
  const scoresDict = getScores();
  // Score d'étape : seul validerMotcle (mot-clé trouvé) l'enregistre. S'il est absent
  // ici, c'est que le mot-clé n'a PAS été trouvé → 0 pt (et surtout pas score_etape,
  // qui a été remis à 10 pour le bloc suivant).
  if (scoresDict['etape_'+stepIdx] === undefined) {
    scoresDict['etape_'+stepIdx] = 0;
  }
  // Ne pas écraser ep_N si déjà sauvegardé (ex: sauvegardé en continu pendant l'épreuve)
  if (scoresDict['ep_'+stepIdx] === undefined || (scoreEpreuve ?? 0) > (scoresDict['ep_'+stepIdx] || 0)) {
    scoresDict['ep_'+stepIdx] = scoreEpreuve ?? 0;
  }
  // Calculer le total uniquement sur les blocs joués (≤ stepIdx)
  const totalNew = Object.entries(scoresDict).reduce((acc, [k, v]) => {
    const m = k.match(/^(?:etape|ep)_(\d+)$/);
    if (m && parseInt(m[1]) <= stepIdx) return acc + (v||0);
    return acc;
  }, 0);

  const upd = {
    scores_etapes: scoresDict,
    total_score: totalNew,
    step_idx: isLast ? stepIdx : stepIdx + 1,
    score_etape: 10,
    indices_shown: 0,
    reponse_epreuve: '{}',
    question_idx: 0,
    epreuve_status: isLast ? 'done' : 'pending',
    etape_status: 'pending',
  };
  await db.from('jp_team_states').update(upd).eq('equipe_nom', currentTeam);
  Object.assign(teamState, {...upd, total_score: totalNew});
  stopTimer();
  renderTeamView();
}

// ===================== POLLING + REALTIME =====================
let pollInterval = null;
let lastPhase = null;
let lastBlocIdx = null;
let motcleSaisi = ''; // préserver la saisie entre les renders
let renderBloqueUntil = 0; // timestamp ms — bloquer les re-renders du poll jusqu'à ce moment

// Détecte un reset (passage en 'waiting') ou le démarrage d'une NOUVELLE partie
// (started_at change) → recharge la page pour repartir d'un état 100% propre. Sinon
// une app joueur restée ouverte peut réécrire d'anciens scores en base juste après
// le reset (avant d'être rechargée), ce qui « ressuscite » des scores parasites.
let _jpStartedAt = undefined, _jpStatus = undefined;
function checkGameRestart(gs){
  const sa = gs?.started_at || null;
  const stt = gs?.status || 'waiting';
  if (_jpStartedAt === undefined) { _jpStartedAt = sa; _jpStatus = stt; return; }
  const reset = (stt === 'waiting' && _jpStatus !== 'waiting');
  const restart = (sa && sa !== _jpStartedAt);
  if (reset || restart) { _jpStartedAt = sa; _jpStatus = stt; try{location.reload();}catch(e){} return; }
  _jpStartedAt = sa; _jpStatus = stt;
}

// Registre des setTimeout actifs pour éviter les doublons
// Clé = type+blocIdx+detail, valeur = {id, endsAt}
const activeTimers = new Map();
function scheduleTimer(key, fireAt, fn) {
  const existing = activeTimers.get(key);
  if (existing && Math.abs(existing.endsAt - fireAt) < 500) return; // déjà planifié à ~même moment
  if (existing) clearTimeout(existing.id);
  const delay = Math.max(0, fireAt - Date.now());
  if (delay > 3600000) return; // > 1h : ignorer
  const id = setTimeout(() => {
    activeTimers.delete(key);
    fn();
  }, delay);
  activeTimers.set(key, {id, endsAt: fireAt});
}
function clearAllTimers() {
  activeTimers.forEach(t => clearTimeout(t.id));
  activeTimers.clear();
}

// Helpers scores_etapes (jsonb dict)
function getParcours() {
  try { return JSON.parse(teamState?.parcours||'[]'); } catch(e) { return []; }
}

function getScores() {
  const raw = teamState?.scores_etapes;
  if (!raw) return {};
  if (Array.isArray(raw)) return {}; // ancienne structure tableau → ignorer
  if (typeof raw === 'object') return raw;
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return {};
    return parsed;
  } catch(e) { return {}; }
}
async function saveScore(key, val) {
  // Sécurité : ne jamais écrire un score si la partie n'est pas en cours (évite de
  // « ressusciter » d'anciens scores après un reset, avant le rechargement de l'app).
  if (gameState?.status !== 'active') return;
  const scores = getScores();
  scores[key] = val;
  // Calculer total uniquement sur les blocs joués
  const parcoursSS = getParcours();
  const Hss = gameState?.started_at ? new Date(gameState.started_at).getTime() : Date.now();
  const schedSS = parcoursSS.length ? computePhaseFromSchedule(Hss, parcoursSS) : {blocIdx:0};
  const curBloc = schedSS.blocIdx;
  const total = Object.entries(scores).reduce((acc, [k, v]) => {
    const m = k.match(/^(?:etape|ep)_(\d+)$/);
    if (m && parseInt(m[1]) <= curBloc) return acc + (v||0);
    return acc;
  }, 0);
  await db.from('jp_team_states')
    .update({scores_etapes: scores, total_score: total})
    .eq('equipe_nom', currentTeam);
  if (teamState) {
    teamState.scores_etapes = scores;
    teamState.total_score = total;
  }
  return {scores, total};
}

function cleanupChannels() {
  try {
    if (typeof db.removeAllChannels === 'function') db.removeAllChannels();
    if (db.realtime?.channels) {
      [...db.realtime.channels].forEach(ch => {
        try { db.removeChannel(ch); } catch(e) {
          try { ch.unsubscribe(); } catch(e2) {}
        }
      });
    }
  } catch(e) { console.warn('cleanup:', e); }
}

window.addEventListener('beforeunload', () => { try { cleanupChannels(); clearAllTimers(); } catch(e) {} });

function subscribeRealtime() {
  cleanupChannels();
  // Realtime (best effort)
  try {
    const ts = Date.now();
    const s1 = db.channel('jp-team-'+currentTeam+'-'+ts)
      .on('postgres_changes',{event:'*',schema:'public',table:'jp_team_states',filter:`equipe_nom=eq.${currentTeam}`}, p=>{
        if (!p.new) return;
        // Protection : ne pas écraser si etape_status='done' local mais pas encore en base
        const sameStep    = (p.new.step_idx ?? -1) === (teamState?.step_idx ?? -1);
        const localDone   = teamState?.etape_status   === 'done' && p.new.etape_status   !== 'done';
        const localEpDone = teamState?.epreuve_status === 'done' && p.new.epreuve_status !== 'done';
        const localShown  = (teamState?.indices_shown||0) >= 6 && (p.new.indices_shown||0) < 6;
        // Indices monotones : un écho Realtime hors-séquence ne doit jamais faire
        // "reculer" le nombre d'indices déjà affichés sur la même étape, sinon le
        // dernier indice apparaît puis disparaît (clignotement) et le score se décale.
        const localMono   = sameStep && (teamState?.indices_shown||0) < 6
                            && (p.new.indices_shown||0) < (teamState?.indices_shown||0);
        if (localDone || localEpDone || localShown || localMono) {
          // Fusionner uniquement les champs sûrs (pas les statuts ni indices_shown)
          const safe = {...p.new};
          if (localDone)   { safe.etape_status   = teamState.etape_status;   safe.score_etape = teamState.score_etape; }
          if (localEpDone) { safe.epreuve_status = teamState.epreuve_status; }
          if (localShown)  { safe.indices_shown  = teamState.indices_shown;  }
          if (localMono)   { safe.indices_shown  = teamState.indices_shown;  safe.score_etape = teamState.score_etape; }
          // Fusionner les scores : prendre le max
          const localScores = getScores();
          const newScores = typeof p.new.scores_etapes === 'object' ? p.new.scores_etapes : {};
          const merged = {...newScores};
          Object.keys(localScores).forEach(k => {
            if ((localScores[k]||0) > (merged[k]||0)) merged[k] = localScores[k];
          });
          safe.scores_etapes = merged;
          teamState = safe;
        } else {
          teamState = p.new;
        }
        isCaptain = appData.capitaines[currentTeam] === currentPlayer;
        renderTeamView();
      }).subscribe();
    const s2 = db.channel('jp-game-'+ts)
      .on('postgres_changes',{event:'*',schema:'public',table:'jp_game_state'}, p=>{
        if (p.new) { checkGameRestart(p.new); gameState=p.new; renderTeamView(); }
      }).subscribe();
    // Subscription photos (validation par admin)
    const sPhotos = db.channel('jp-photos-'+currentTeam+'-'+ts)
      .on('postgres_changes',{event:'*',schema:'public',table:'photos',filter:`equipe_nom=eq.${currentTeam}`}, p=>{
        // Forcer le sync (bypasser le throttle) car c'est un vrai changement
        _lastSyncPhotos = 0;
        renderTeamView();
      }).subscribe();
    const s3 = db.channel('jp-config-'+ts)
      .on('postgres_changes',{event:'*',schema:'public',table:'jp_config'}, p=>{
        if (!p.new) return;
        appData.config[p.new.key]=p.new.value;
        if (p.new.key.startsWith('jdp_capitaine_')) {
          appData.capitaines[p.new.key.replace('jdp_capitaine_','')]=p.new.value;
          isCaptain=appData.capitaines[currentTeam]===currentPlayer;
          document.getElementById('headerPlayer').textContent=(isCaptain?'⚓ Capitaine · ':'')+currentPlayer;
          renderTeamView();
        }
      }).subscribe();
    realtimeSubs.push(s1,s2,s3);
  } catch(e) { console.warn('Realtime non disponible, polling uniquement'); }

  // Polling — plus fréquent en mode accéléré
  const mult = gameState?.time_multiplier || 1;
  const pollDelay = Math.max(500, Math.round(3000 / mult));
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    try {
      const [gsRes, tsRes, capRes] = await Promise.all([
        db.from('jp_game_state').select('id,status,started_at,time_multiplier').eq('id',1).maybeSingle(),
        db.from('jp_team_states').select('*').eq('equipe_nom',currentTeam).maybeSingle(),
        db.from('jp_config').select('key,value').like('key','jdp_capitaine_%')
      ]);
      let changed = false;

      if (gsRes.data) checkGameRestart(gsRes.data);
      if (gsRes.data && gsRes.data.status !== gameState?.status) {
        gameState = gsRes.data; changed = true;
      }

      if (tsRes.data) {
        // Ne JAMAIS écraser teamState si le flag motcleTrouve est actif
        // ou si indices_shown local >= 6 et la base n'est pas encore à jour
        const localShown = teamState?.indices_shown || 0;
        const baseShown  = tsRes.data.indices_shown || 0;
        // Protéger si mot-clé validé localement OU etape_status='done' local pas encore en base
        const localDone = teamState?.etape_status === 'done' && tsRes.data.etape_status !== 'done';
        const protege   = (localShown >= 6 && baseShown < 6) || localDone;

        if (!protege) {
          const prevShown   = teamState?.indices_shown;
          const prevReponse = teamState?.reponse_epreuve;
          const prevQIdx    = teamState?.question_idx;
          const prevVotes   = teamState?.votes_capitaine;

          // Fusionner : garder les scores locaux si plus récents
          const localScores = getScores();
          const rawBase = tsRes.data.scores_etapes;
          const baseScores = !rawBase ? {} : typeof rawBase === 'object' ? rawBase : (()=>{try{return JSON.parse(rawBase);}catch(e){return {};}})();
          // Prendre la valeur max pour chaque clé (évite de régresser)
          const mergedScores = {...baseScores};
          Object.keys(localScores).forEach(k => {
            if ((localScores[k]||0) > (mergedScores[k]||0)) mergedScores[k] = localScores[k];
          });
          const mergedTotal = Object.values(mergedScores).reduce((a,b)=>a+(b||0),0);

          teamState = {
            ...tsRes.data,
            scores_etapes: JSON.stringify(mergedScores),
            total_score: mergedTotal,
          };

          if (baseShown !== prevShown || prevReponse !== tsRes.data.reponse_epreuve ||
              prevQIdx !== tsRes.data.question_idx || prevVotes !== tsRes.data.votes_capitaine ||
              tsRes.data.etape_status !== teamState?.etape_status ||
              tsRes.data.epreuve_status !== teamState?.epreuve_status) {
            changed = true;
          }
        }

        // Vérifier changement de phase calculée
        let p2; try{p2=(()=>{try{return JSON.parse(tsRes.data?.parcours||'[]');}catch(e){return [];}})();}catch(e){p2=[];}
        if (p2.length && gameState?.started_at) {
          const s2 = computePhaseFromSchedule(new Date(gameState.started_at).getTime(), p2);
          if (s2.phase !== lastPhase || s2.blocIdx !== lastBlocIdx) {
            const prevPhase   = lastPhase;
            const prevBlocIdx = lastBlocIdx;

            // Transition : on QUITTE la phase étape (étape→règles, même bloc) sans avoir
            // validé le mot-clé → 0 pt pour l'étape, enregistré IMMÉDIATEMENT. (Le score
            // n'est gagné que via validerMotcle, qui aurait déjà rempli scores_etapes.)
            if (prevPhase === 'etape' && s2.phase !== 'etape' && prevBlocIdx !== null && isCaptain) {
              const sc0 = getScores();
              if (sc0['etape_'+prevBlocIdx] === undefined || sc0['etape_'+prevBlocIdx] === null) {
                saveScore('etape_'+prevBlocIdx, 0);
                db.from('jp_team_states').update({etape_status:'done', score_etape:0}).eq('equipe_nom',currentTeam);
                if (teamState) teamState.etape_status = 'done';
              }
            }

            // Transition : fin d'épreuve (changement de bloc OU passage en 'done' pour
            // le dernier bloc — où s2.blocIdx reste égal au dernier index).
            const stepIdxBase = teamState?.step_idx ?? 0;
            const finEpreuve = (s2.blocIdx !== prevBlocIdx || (s2.phase === 'done' && prevPhase === 'epreuve'));
            if (prevBlocIdx !== null && finEpreuve && teamState?.epreuve_status !== 'done'
                && stepIdxBase === prevBlocIdx && isCaptain) {
              const p3 = getParcours();
              const b3 = p3[prevBlocIdx];
              const et3 = appData.etapes?.find(e=>String(e.id)===String(b3?.etapeId));
              const ep3 = et3?.epreuveId ? appData.epreuves?.find(ep=>String(ep.id)===String(et3.epreuveId)) : null;
              if (ep3) {
                const rep3 = (()=>{try{return JSON.parse(teamState?.reponse_epreuve||'{}');}catch(e){return {};}})();
                const pts3 = calcScoreEpreuve(ep3, rep3);
                if (teamState) teamState.epreuve_status = 'done';
                lastPhase = s2.phase; lastBlocIdx = s2.blocIdx;
                terminerEpreuve(pts3, prevBlocIdx);
                return;
              }
            }

            // Transition : fin d'étape sans mot-clé
            if (prevBlocIdx !== null && s2.blocIdx !== prevBlocIdx && teamState?.etape_status !== 'done'
                && stepIdxBase === prevBlocIdx && isCaptain) {
              const existingScore = getScores()['etape_'+prevBlocIdx];
              if (existingScore === undefined || existingScore === null) {
                // Étape quittée sans valider le mot-clé → 0 pt (le score n'est gagné
                // que via validerMotcle).
                saveScore('etape_'+prevBlocIdx, 0);
                db.from('jp_team_states').update({etape_status:'done', score_etape:0}).eq('equipe_nom',currentTeam);
              } else {
                db.from('jp_team_states').update({etape_status:'done'}).eq('equipe_nom',currentTeam);
              }
              if (teamState) teamState.etape_status = 'done';
            }

            lastPhase = s2.phase; lastBlocIdx = s2.blocIdx;
            renderBloqueUntil = 0; // relâcher immédiatement sur changement de phase
            changed = true;
          }
        }
      }

      (capRes.data||[]).forEach(r => {
        const team = r.key.replace('jdp_capitaine_','');
        if (appData.capitaines[team] !== r.value) { appData.capitaines[team] = r.value; changed = true; }
      });

      if (changed) {
        isCaptain = appData.capitaines[currentTeam] === currentPlayer;
        document.getElementById('headerPlayer').textContent = (isCaptain?'⚓ Capitaine · ':'')+currentPlayer;
        // Re-render sauf si période de blocage post-validation
        if (Date.now() < renderBloqueUntil) {
          updateScoreBand();
        } else {
          // Préserver le contenu du motcleInput si focus dessus
          const focused = document.activeElement;
          const motcleVal = focused?.id === 'motcleInput' ? focused.value : null;
          renderTeamView();
          // Restaurer le focus et la valeur si nécessaire
          if (motcleVal !== null) {
            const el = document.getElementById('motcleInput');
            if (el && el.value !== motcleVal) {
              el.value = motcleVal;
              el.focus();
            }
          }
        }
      }
    } catch(e) { console.warn('Poll error:', e); }
  }, pollDelay);
}

init();
</script>
